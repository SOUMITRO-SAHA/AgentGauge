# Pinned Rust toolchain: the single source of truth for which compiler,
# rustfmt, and Clippy every developer and CI runner uses for the Tauri app.
#
# rustup resolves this file from the working directory upward, so cargo must
# run with this directory (or below) as the CWD — `--manifest-path` invocations
# from the repo root do NOT pick this pin up and silently use the default
# toolchain.
#
# The channel must stay >= the highest dependency MSRV in Cargo.lock
# (currently 1.95 via sysinfo); `tauri dev` resolves dependencies with this
# pin and fails outright below that floor.
#
# The targets list makes rustup materialize both macOS architectures with
# the pinned toolchain wherever this file resolves — required for the
# `--target universal-apple-darwin` release build, which fails at the Intel
# half if only the host target is installed.

[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
