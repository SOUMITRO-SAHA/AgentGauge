[package]
name = "aism"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri's switch between "load devUrl from the Vite dev server" and "serve the
# bundled frontendDist". Enabling it lets a *debug* build embed the compiled
# frontend, which is what makes the E2E suite runnable without a Vite server.
custom-protocol = ["tauri/custom-protocol"]
# Exposes `testkit` so the integration tests under `tests/` can reach the
# transport and decoders, which are private to their modules by design.
testkit = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# E2E testing plugins. Registered only under #[cfg(debug_assertions)] in
# src/lib.rs, so they are compiled into debug builds but never activated in release.
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
