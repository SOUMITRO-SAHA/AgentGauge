[package]
name = "agentgauge"
version = "0.2.0"
description = "AgentGauge desktop app and coding-harness usage monitor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentgauge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri's switch between "load devUrl from the Vite dev server" and "serve the
# bundled frontendDist". Enabling it lets a *debug* build embed the compiled
# frontend, which is what makes the E2E suite runnable without a Vite server.
custom-protocol = ["tauri/custom-protocol"]
# Exposes `testkit` so the integration tests under `tests/` can reach the
# transport and decoders, which are private to their modules by design.
testkit = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The app's only HTTP client: the plugin's vetted reqwest stack, used for the
# coding-plan usage endpoints. No hand-rolled transport anywhere.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The durable store behind every persisted module. `bundled` compiles SQLite
# from source, so no system library is needed on any platform; the connection
# is owned by the backend (client -> server -> db), never the renderer.
rusqlite = { version = "0.40", features = ["bundled"] }
# Process facts (pid, parent, RSS, start time) for the read-only Processes
# screen. `system` only: the default feature set (disks, networks, components,
# users, gpu) is disabled so none of it is compiled. Approved by the user.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# The logging facade every module emits through; `shared::logging` is the only
# sink (a rotated, PII-scrubbed file). Already in the graph via `tauri` at the
# same version, so this names an existing crate rather than adding one.
# Approved by the user as part of the logger-service task.
log = "0.4"
# E2E testing plugins. Registered only under #[cfg(debug_assertions)] in
# src/lib.rs, so they are compiled into debug builds but never activated in release.
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# macOS Dock tile for unbundled debug runs. `tauri dev` gets this from Tauri's
# own `cfg(dev)` path, but the e2e binary is a plain `cargo build` and would
# otherwise show the generic `exec` tile. These three crates are already in the
# graph via `tauri` at these exact versions, so no new crate is compiled; they
# are named directly only because Rust requires a direct declaration to `use`.
# `default-features = false` keeps each one to the single type we call.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
