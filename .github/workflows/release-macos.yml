name: Publish macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Verify release version and tag
        working-directory: app
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf '%s\n' 'Release tag must have the form vX.Y.Z.' >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            printf 'Release tag does not exist: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          workflow_commit="$(git rev-parse HEAD)"
          bun scripts/verify-updater-release.ts "$RELEASE_TAG" "$tag_commit" "$workflow_commit"

      - name: Verify release artifact contract
        working-directory: app
        run: bash scripts/tests/release-macos-artifacts.sh

      - name: Verify release credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$HOMEBREW_TAP_TOKEN"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: SOUMITRO-SAHA/homebrew-agentgauge
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-agentgauge

      - name: Build the universal app
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        run: bun run tauri build --target universal-apple-darwin --bundles app --config src-tauri/tauri.updater-release.conf.json

      - name: Embed and sign WidgetKit
        env:
          AGENTGAUGE_WIDGET_ARCH: universal
          AGENTGAUGE_SIGN_IDENTITY: "-"
        run: |
          app_bundle="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentGauge.app"
          ./app/src-tauri/widget/build-widget.sh all "$app_bundle"

      - name: Create the distribution DMG
        run: |
          app_bundle="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentGauge.app"
          artifact_dir="$(dirname "$app_bundle")"
          dmg_root="$RUNNER_TEMP/AgentGauge-dmg"
          version="${RELEASE_TAG#v}"
          dmg="$artifact_dir/AgentGauge-$version-universal.dmg"
          mkdir -p "$dmg_root"
          ditto "$app_bundle" "$dmg_root/AgentGauge.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create -volname AgentGauge -srcfolder "$dmg_root" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"

      - name: Create final signed manifests and checksums
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          app_bundle="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentGauge.app"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/agentgauge-updater.key"
          chmod 600 "$RUNNER_TEMP/agentgauge-updater.key"
          unset TAURI_SIGNING_PRIVATE_KEY
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$RUNNER_TEMP/agentgauge-updater.key"
          bun run app/scripts/create-updater-release.ts "$app_bundle" "$RELEASE_TAG"

      - name: Build architecture-specific DMGs
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          version="${RELEASE_TAG#v}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            case "$target" in
              aarch64-apple-darwin)
                widget_arch=arm64
                dmg_label=Apple-Silicon-arm64
                ;;
              x86_64-apple-darwin)
                widget_arch=x86_64
                dmg_label=Intel-x86_64
                ;;
            esac

            bun run tauri build --target "$target" --bundles app
            app_bundle="src-tauri/target/$target/release/bundle/macos/AgentGauge.app"
            AGENTGAUGE_WIDGET_ARCH="$widget_arch" AGENTGAUGE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" ./src-tauri/widget/build-widget.sh all "$app_bundle"

            for binary in \
              "$app_bundle/Contents/MacOS/agentgauge" \
              "$app_bundle/Contents/PlugIns/AIStatsWidget.appex/Contents/MacOS/AIStatsWidget" \
              "$app_bundle/Contents/Frameworks/libWidgetBridge.dylib"; do
              actual_archs="$(lipo -archs "$binary")"
              if [ "$actual_archs" != "$widget_arch" ]; then
                printf 'Expected %s in %s, found %s\n' "$widget_arch" "$binary" "$actual_archs" >&2
                exit 1
              fi
            done

            artifact_dir="$(dirname "$app_bundle")"
            dmg_root="$RUNNER_TEMP/AgentGauge-dmg-$dmg_label"
            dmg_path="$artifact_dir/AgentGauge-${version}-${dmg_label}.dmg"
            mkdir -p "$dmg_root"
            ditto "$app_bundle" "$dmg_root/AgentGauge.app"
            ln -s /Applications "$dmg_root/Applications"
            hdiutil create -volname AgentGauge -srcfolder "$dmg_root" -ov -format UDZO "$dmg_path"
            hdiutil verify "$dmg_path"
            (
              cd "$artifact_dir"
              shasum -a 256 "$(basename "$dmg_path")" > "$(basename "$dmg_path").sha256"
            )
          done

      - name: Publish GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app_bundle="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentGauge.app"
          artifact_dir="$(dirname "$app_bundle")"
          version="${RELEASE_TAG#v}"
          cp "$artifact_dir/AgentGauge-$version-universal.dmg" "$artifact_dir/AgentGauge-universal.dmg"
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "AgentGauge $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "$artifact_dir/AgentGauge.app.tar.gz" \
            "$artifact_dir/AgentGauge.app.tar.gz.sig" \
            "$artifact_dir/AgentGauge.app.tar.gz.sha256" \
            "$artifact_dir/AgentGauge-$version-universal.dmg" \
            "$artifact_dir/AgentGauge-$version-universal.dmg.sha256" \
            "$artifact_dir/AgentGauge-universal.dmg" \
            "$artifact_dir/latest.json" \
            "$artifact_dir/latest-macos.json" \
            "$artifact_dir/AgentGauge-${version}-Apple-Silicon-arm64.dmg" \
            "$artifact_dir/AgentGauge-${version}-Apple-Silicon-arm64.dmg.sha256" \
            "$artifact_dir/AgentGauge-${version}-Intel-x86_64.dmg" \
            "$artifact_dir/AgentGauge-${version}-Intel-x86_64.dmg.sha256"
          gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Publish Homebrew Cask
        run: |
          app_bundle="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/AgentGauge.app"
          artifact_dir="$(dirname "$app_bundle")"
          version="${RELEASE_TAG#v}"
          mkdir -p homebrew-agentgauge/Casks
          cp "$artifact_dir/agentgauge.rb" homebrew-agentgauge/Casks/agentgauge.rb
          git -C homebrew-agentgauge config user.name "github-actions[bot]"
          git -C homebrew-agentgauge config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-agentgauge add Casks/agentgauge.rb
          if ! git -C homebrew-agentgauge diff --cached --quiet; then
            git -C homebrew-agentgauge commit -m "Update AgentGauge to $version"
            git -C homebrew-agentgauge push origin HEAD:main
          fi

      - name: Remove release signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/agentgauge-updater.key"
